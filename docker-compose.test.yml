# TEST-ONLY PostgreSQL for Phase 2B integration tests.
# Never use this service or its credentials for application/production data.
name: standard-barrels-phase2b2-test

services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: phase2b2_test
      POSTGRES_PASSWORD: local_test_password
      POSTGRES_DB: standard_barrels_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phase2b2_test -d standard_barrels_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - phase2b2-test-data:/var/lib/postgresql/data

volumes:
  phase2b2-test-data:
